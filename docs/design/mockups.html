<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarCheck · screen mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
--ink:#131517;--ink2:#454B50;--ink3:#646B70;
--paper:#FFFFFF;--paper2:#F1F2F2;--paper3:#E4E7E8;
--rule:#D3D7D9;--outline:#8A9196;
--accent:#1F4E96;--accent-press:#173B72;--accent-wash:#E9EEF6;
--new:#C8321B;--new-wash:#FBEAE7;--unc:#F0A81C;--unc-ink:#9A5B00;
--rebate:#0C0D0E;--rebate2:#1A1D1F;--rebate3:#2A2E31;--rebate-rule:#3A4044;
--on-rebate:#F4F5F5;--on-rebate2:#A3AAAE;--accent-dark:#7FA6E6;
--f:"Barlow",system-ui,sans-serif;--fc:"Barlow Semi Condensed","Barlow",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s20{width:20px;height:20px}.i.s18{width:18px;height:18px}.i.s16{width:16px;height:16px}
.num{font-feature-settings:"tnum" 1,"zero" 1}
.code{font-family:var(--fc);font-weight:500;font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;font-feature-settings:"tnum" 1,"zero" 1}
.mk-t{font:600 14px var(--f);text-anchor:middle;font-feature-settings:"tnum" 1}
.g{width:22px;height:22px;flex:none;overflow:visible}

/* photo tones (synthetic placeholders) */
.ph-white{--sky:#C9CDD0;--wall:#AEB4B8;--wall-line:#9CA2A6;--ground:#7A8084;--paint:#D9DCDE;--shadow:#4E5357;--body:#ECEEEF;--glass:#3F454A;--seam:#9DA3A7;--tyre:#232629;--rim:#9AA0A4;--lamp:#C4C9CC}
.ph-after{--sky:#B3B6B6;--wall:#979B9E;--wall-line:#868A8D;--ground:#63686C;--paint:#C1C4C6;--shadow:#3D4145;--body:#D8DADB;--glass:#33383C;--seam:#899095;--tyre:#1D2023;--rim:#858A8E;--lamp:#AEB2B5}
.ph-dark{--sky:#C3C8CB;--wall:#A8AEB2;--wall-line:#969CA0;--ground:#767C80;--paint:#D6D9DB;--shadow:#4A4F53;--body:#4B5156;--glass:#2B3034;--seam:#33383C;--tyre:#1D2023;--rim:#8E9498;--lamp:#9EA4A8}
.photo{display:block}

/* orbit */
.orbit{display:block;overflow:visible}
.orbit.on-dark{--tc-body:#2A2E31;--tc-line:#A3AAAE;--tc-glass:#0C0D0E}
.orbit.on-light{--tc-body:#FFFFFF;--tc-line:#454B50;--tc-glass:#D3D7D9}
.seg{fill:none;stroke-width:7;stroke-linecap:butt}
.on-dark .seg.todo{stroke:#3A4044}.on-dark .seg.done{stroke:#F4F5F5}.on-dark .seg.now{stroke:var(--accent-dark)}.on-dark .seg.new{stroke:var(--new)}
.on-dark .seg.skip{stroke:#A3AAAE;stroke-dasharray:2 2.5}
.on-light .seg.todo{stroke:#D3D7D9}.on-light .seg.done{stroke:var(--ink)}.on-light .seg.now{stroke:var(--accent)}.on-light .seg.skip{stroke:var(--ink3);stroke-dasharray:2 2.5}
.on-dark .cam-halo{fill:rgba(127,166,230,.28)}.on-dark .cam-dot{fill:var(--accent-dark)}
.on-light .cam-halo{fill:rgba(31,78,150,.18)}.on-light .cam-dot{fill:var(--accent)}

/* device */
.phone{width:390px;height:844px;position:relative;overflow:hidden;border-radius:32px;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:22px;box-shadow:0 0 0 1px rgba(19,21,23,.16),0 24px 48px -20px rgba(19,21,23,.35);-webkit-font-smoothing:antialiased}
.phone.dark{background:var(--rebate);color:var(--on-rebate)}
.sb{height:28px;display:flex;align-items:center;justify-content:space-between;padding:4px 24px 0 26px;font-weight:600;font-size:14px}
.sb-r{display:flex;gap:6px;align-items:center}
.gesture{position:absolute;left:0;right:0;bottom:0;height:24px;display:grid;place-items:center;color:var(--ink)}
.gesture i{width:108px;height:4px;border-radius:2px;background:currentColor;opacity:.85}
.g-dark{color:var(--on-rebate)}

/* buttons */
.btn{height:52px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:17px;line-height:1;padding:0 20px;white-space:nowrap}
.btn-primary{background:var(--ink);color:#fff}
.btn-accent{background:var(--accent);color:#fff}
.btn-secondary{border:1.5px solid var(--ink);color:var(--ink)}
.btn-quiet{color:var(--accent);padding:0 12px}
.btn-sm{height:40px;font-size:15px;padding:0 14px;border-radius:6px}
.btn-tonal{background:var(--accent-wash);color:var(--accent)}
.dark .btn-primary{background:var(--on-rebate);color:var(--ink)}
.dark .btn-secondary{border-color:var(--on-rebate2);color:var(--on-rebate)}
.icon-btn{width:48px;height:48px;display:grid;place-items:center;border-radius:24px;flex:none}

/* app bar */
.appbar{height:64px;display:flex;align-items:center;padding:0 4px 0 16px;gap:4px}
.appbar h1{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.01em;flex:1}
.topbar{height:56px;display:flex;align-items:center;padding:0 4px;gap:4px}
.topbar .t{flex:1;min-width:0}
.topbar .t b{display:block;font-size:18px;line-height:22px;font-weight:600}
.topbar .t span{display:block;font-size:14px;line-height:18px;color:var(--ink2)}
.dark .topbar .t span{color:var(--on-rebate2)}

/* search */
.search{margin:0 16px 4px;height:48px;border-radius:6px;background:var(--paper2);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--ink3);font-size:16px}
.search .i{color:var(--ink2)}

/* lists */
.sect{display:flex;align-items:baseline;gap:8px;padding:22px 16px 6px}
.sect h2{font-size:15px;line-height:20px;font-weight:600;color:var(--ink)}
.sect .n{font-size:15px;color:var(--ink3);font-weight:500}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative}
.row::after{content:"";position:absolute;left:16px;right:0;bottom:0;height:1px;background:var(--rule)}
.row:last-child::after{display:none}
.row .main{flex:1;min-width:0}
.row .l1{display:flex;align-items:center;gap:10px}
.row .l2{font-size:15px;line-height:20px;color:var(--ink2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .l3{font-size:15px;line-height:20px;color:var(--ink2);margin-top:1px;display:flex;align-items:center;gap:6px}
.row .l3.late{color:var(--ink);font-weight:600}
.plate{display:inline-block;font-weight:600;font-size:18px;line-height:20px;letter-spacing:.05em;border:1.5px solid var(--ink);border-radius:3px;padding:2px 6px 1px;color:var(--ink);background:#fff}
.plate.sm{font-size:14px;line-height:16px;padding:1px 5px 0;border-width:1.25px}
.prog8{display:flex;gap:2px}
.prog8 i{width:10px;height:4px;background:var(--rule)}
.prog8 i.on{background:var(--ink)}
.unfinished{background:var(--paper2)}
.unfinished .row::after{background:var(--paper3)}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:24px;height:80px;display:flex;border-top:1px solid var(--rule);background:var(--paper)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink2);font-size:13px;line-height:16px;font-weight:500;text-decoration:none}
.nav a .ind{width:56px;height:32px;border-radius:8px;display:grid;place-items:center}
.nav a.on{color:var(--ink);font-weight:600}
.nav a.on .ind{background:var(--accent-wash);color:var(--accent)}
.fab{position:absolute;right:16px;bottom:120px;height:56px;border-radius:14px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:0 22px 0 18px;font-weight:600;font-size:17px;box-shadow:0 2px 4px rgba(19,21,23,.2),0 8px 20px -6px rgba(19,21,23,.4)}

/* segmented */
.seg-ctl{display:flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;height:44px}
.seg-ctl button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:15px;color:var(--ink);position:relative}
.seg-ctl button+button{border-left:1.5px solid var(--ink)}
.seg-ctl button.on{background:var(--ink);color:#fff}
.dark .seg-ctl{border-color:var(--rebate-rule)}
.dark .seg-ctl button{color:var(--on-rebate)}
.dark .seg-ctl button+button{border-left-color:var(--rebate-rule)}
.dark .seg-ctl button.on{background:var(--on-rebate);color:var(--ink)}

/* chips (damage types) */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{height:48px;border:1.5px solid var(--outline);border-radius:4px;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:500;font-size:15px;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.lbl{font-size:14px;line-height:18px;font-weight:600;color:var(--ink2)}
.lbl em{font-style:normal;font-weight:500;color:var(--ink3)}

/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);color:var(--ink);border-radius:14px 14px 0 0;box-shadow:0 -2px 6px rgba(0,0,0,.18),0 -12px 32px -8px rgba(0,0,0,.45)}
.dark .sheet .seg-ctl{border-color:var(--ink)}.dark .sheet .seg-ctl button{color:var(--ink)}.dark .sheet .seg-ctl button+button{border-left-color:var(--ink)}
.dark .sheet .btn-primary{background:var(--ink);color:#fff}
.handle{width:36px;height:4px;border-radius:2px;background:var(--outline);margin:10px auto 6px}

/* camera + dark chrome */
.edge{color:var(--on-rebate2)}
.tag{position:absolute;display:flex;align-items:center;gap:6px;background:rgba(12,13,14,.78);color:var(--on-rebate);padding:4px 8px;border-radius:3px}
.tag b{font-family:var(--f);font-weight:700;font-size:13px;letter-spacing:.06em}

/* doc */
body.doc{background:#E4E7E8;font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased}
.doc-head{max-width:1320px;margin:0 auto;padding:48px 32px 8px}
.doc-head h1{font-size:32px;line-height:38px;font-weight:600;letter-spacing:-.01em}
.doc-head p{margin-top:10px;font-size:17px;line-height:26px;color:var(--ink2);max-width:72ch}
.boards{max-width:1320px;margin:0 auto;padding:32px;display:grid;grid-template-columns:repeat(auto-fill,390px);gap:56px 48px;justify-content:start}
.boards figure{margin:0}
.boards figcaption{margin-top:16px;max-width:390px}
.boards figcaption b{display:block;font-size:17px;line-height:22px;font-weight:600}
.boards figcaption span{display:block;margin-top:4px;font-size:15px;line-height:22px;color:var(--ink2)}
.boards figure.wide{grid-column:1/-1}
.boards figure.wide figcaption{max-width:72ch}
body.single{background:#E4E7E8;display:grid;place-items:center;min-height:100vh;padding:24px;font-family:var(--f)}

.land{position:absolute;left:0;top:0;width:844px;height:390px;transform-origin:0 0;transform:translateX(390px) rotate(90deg);display:flex;background:var(--rebate)}
.cam-left{width:128px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 0 26px}
.cam-orbit{display:flex;flex-direction:column;align-items:center;gap:6px}
.cam-text{height:48px;display:flex;align-items:center;gap:6px;padding:0 12px;font-weight:600;font-size:16px;color:var(--on-rebate)}
.cam-frame{width:520px;height:390px;position:relative;flex:none;overflow:hidden}
.cam-title{left:50%;top:14px;transform:translateX(-50%);padding:6px 10px}
.cam-title{flex-direction:column;align-items:center;gap:2px}.ct1{display:flex;gap:8px;align-items:center}.ct2{font-size:14px;line-height:18px;font-weight:500;color:var(--on-rebate2);white-space:nowrap}
.cam-right{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 0 30px}
.cam-right-top{display:flex;gap:8px}
.cam-toggle{height:48px;min-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--on-rebate2);border-radius:6px}
.cam-toggle.on{color:var(--on-rebate);background:var(--rebate3)}
.shutter{width:80px;height:80px;border-radius:50%;border:4px solid var(--on-rebate);display:grid;place-items:center}
.shutter i{width:62px;height:62px;border-radius:50%;background:var(--on-rebate)}
.last{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--on-rebate2)}
.last svg{border-radius:2px;outline:1.5px solid var(--on-rebate2);outline-offset:2px}
.land-g{bottom:0}
.cust-li{display:flex;align-items:center;gap:12px;min-height:40px;font-size:18px;line-height:24px;color:var(--ink)}.cust-li .g{width:26px;height:26px}.cust-li b{font-weight:600}
.sl-handle{position:absolute;width:48px;height:48px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:0;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.sl-handle .i{margin:0 -3px}
.tgl{height:40px;border-radius:6px;border:1.5px solid var(--rebate-rule);display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:600;font-size:15px;color:var(--on-rebate2)}
.tgl.on{background:var(--rebate3);border-color:var(--rebate3);color:var(--on-rebate)}
.found-h{padding:18px 16px 6px;font-size:14px;line-height:18px;font-weight:600;color:var(--on-rebate2)}
.found{display:flex;align-items:center;gap:12px;margin:0 16px;min-height:52px;padding:0 4px 0 12px;border-top:1px solid var(--rebate-rule);font-size:16px;color:var(--on-rebate)}
.found .g{width:24px;height:24px}
.found b{font-weight:600}
.found .i{color:var(--on-rebate2)}
.strip{position:absolute;left:16px;right:16px;bottom:112px;display:flex;justify-content:space-between;padding-top:14px;border-top:1px solid var(--rebate-rule)}
.fr{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--on-rebate2)}
.fr svg.photo{border-radius:2px;opacity:.55}
.fr.done svg.photo{opacity:1}
.fr.now svg.photo{opacity:1;outline:2px solid var(--accent-dark);outline-offset:2px}
.fr.now{color:var(--on-rebate)}
.fr .st{position:absolute;right:-4px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--on-rebate);color:var(--ink);display:grid;place-items:center}
.fr .st .i{width:12px;height:12px;stroke-width:3}
.fr .st.dot{background:var(--new);border:2px solid var(--rebate)}

.ev{width:1200px;height:800px;background:#fff;color:var(--ink);font-family:var(--f);padding:28px 32px 0;position:relative;box-shadow:0 0 0 1px rgba(19,21,23,.16),0 24px 48px -20px rgba(19,21,23,.35);-webkit-font-smoothing:antialiased}
.ev-h{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.ev-h h1{font-size:40px;line-height:44px;font-weight:700;letter-spacing:-.015em}
.ev-meta{margin-top:6px;font-size:17px;line-height:22px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.ev-ag{text-align:right;display:flex;flex-direction:column;font-size:15px;line-height:20px;color:var(--ink2)}
.ev-ag b{font-size:18px;line-height:22px;color:var(--ink);font-weight:600}
.ev-pair{display:flex;gap:24px;margin-top:16px}
.ev-pair figure{margin:0}
.ev-lbl{display:flex;align-items:center;gap:12px;height:36px;font-size:16px;color:var(--ink2);font-weight:500}
.ev-lbl b{font-size:20px;font-weight:700;letter-spacing:.06em;padding:3px 10px 2px;border-radius:2px}
.ev-b{border:2px solid var(--ink);color:var(--ink)}
.ev-a{background:var(--ink);color:#fff;border:2px solid var(--ink)}
.rebate{background:var(--rebate);padding:6px 6px 0;margin-top:6px}
.rebate .code{color:var(--on-rebate2);height:24px;display:flex;align-items:center;padding:0 2px;font-size:12px}
.ev-cap{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}
.cap{display:flex;gap:12px;align-items:flex-start}
.cap .g{width:28px;height:28px;margin-top:1px}
.cap p{font-size:19px;line-height:27px;color:var(--ink2)}
.cap b{color:var(--ink);font-weight:600}
.ev-f{position:absolute;left:32px;right:32px;bottom:20px;display:flex;align-items:center;gap:20px;padding-top:14px;border-top:1px solid var(--rule);font-size:16px;color:var(--ink2)}
.leg{display:flex;align-items:center;gap:6px;font-weight:500}
.leg .g{width:24px;height:24px}
.ev-f .code{color:var(--ink3)}
</style></head>
<body class="doc">
<!--
THESIS: CarCheck is an inspector's contact sheet. Photos are frames, metadata is film edge code, damage is grease pencil. It refuses the SaaS dashboard (cards, stat tiles, pills, gradients).
OWN-WORLD: White paper, ink #131517, grey-card #F1F2F2 bands, one cyanotype blue #1F4E96 for action and selection only. Film-rebate black #0C0D0E around every photo screen. Damage marks: vermilion filled circle (new), white hollow square (existing), amber diamond (uncertain). Barlow for everything, with Barlow Semi Condensed edge codes. 1 dp hairlines, radii 2 to 6 dp, no cards.
STORY: Walk the car, mark what is there, the customer signs, then on return compare frame against frame. The evidence explains itself.
FIRST VIEWPORT: Rentals: search, Unfinished row with Resume, Due back rows with the plate as the largest text and inline Return, ink "New rental" FAB in thumb reach, 3-tab bar.
FORM: candidate 7 of 7 (photographer's contact sheet and calibration kit), seed 7a1a22ca.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
